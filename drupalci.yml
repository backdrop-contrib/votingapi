build:
  assessment:
    validate_codebase:
      container_composer:
        halt-on-fail: false
      phplint: {  }
      phpcs:
        start_directory: null
        sniff-all-files: false
        halt-on-fail: false
        coder-version: ^8.2@stable
      eslint:
        halt-on-fail: false
    testing:
      container_command:
        commands:
          - "rm -rf /usr/local/bin/drush && curl -Lo /usr/local/bin/drush https://github.com/drush-ops/drush/releases/download/8.1.16/drush.phar && chmod +x /usr/local/bin/drush"
      run_tests_d7:
        testgroups: '--all'
        types: 'Simpletest,PHPUnit-Unit,PHPUnit-Kernel,PHPUnit-Functional'
        color: true
        die-on-fail: false
        keep-results: true
        keep-results-table: false
        verbose: false
        concurrency: 0
        halt-on-fail: false
        repeat: 1
        suppress-deprecations: true
